<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital - Yarã</title>
    <link rel="stylesheet" href="../assets/css/modern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .library-page { padding: 120px 5% 60px; }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.9rem;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
            border-color: var(--accent);
            font-weight: 600;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-input {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            width: 100%;
            max-width: 480px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.12);
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .asset-card {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
        }
        .asset-icon {
            font-size: 2.2rem;
            color: var(--accent);
        }
        .asset-tipo-badge {
            display: inline-block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(255,213,79,0.15);
            color: var(--accent);
            width: fit-content;
        }
        .asset-title {
            color: var(--accent);
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0;
        }
        .asset-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.55;
            flex: 1;
        }
        .asset-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            padding-top: 14px;
            margin-top: auto;
        }
        .asset-etnia {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
        }
        .asset-etnia i { color: var(--accent); font-size: 0.7rem; }
        .download-btn {
            background: rgba(250,204,21,0.1);
            color: var(--accent);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .download-btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
        }
        .download-btn.sem-link {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Estados de carregamento e vazio */
        .estado-container {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 60px 20px;
            color: var(--text-muted);
            text-align: center;
        }
        .estado-container i { font-size: 3rem; color: var(--accent); opacity: 0.5; }
        .estado-container p { font-size: 1rem; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,213,79,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .contador-resultados {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* Skeleton loading */
        .skeleton-card {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .skeleton-line {
            height: 14px;
            border-radius: 8px;
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-line.lg { height: 20px; width: 70%; }
        .skeleton-line.sm { width: 40%; }
        @keyframes shimmer { to { background-position: -200% 0; } }
    </style>
</head>
<body>
    <nav class="nav-modern glass">
        <div class="logo-area">
            <img src="../img/yara94.png" alt="Logo Yarã">
            <span style="font-weight: 800; color: var(--accent);">YARÃ</span>
        </div>
        <div class="nav-links">
            <a href="/yara-web/index.html">Home</a>
            <a href="nossa-voz.html">Nossa Voz</a>
            <a href="biblioteca.html" class="active">Biblioteca</a>
            <a href="timeline.html">História</a>
            <a href="contribuir.html">Dados</a>
            <a href="tradutor.html">Tradutor</a>
            <a href="agente.html">Agente IA</a>
            <a href="sobreNos.html">Sobre Nós</a>
        </div>
    </nav>

    <main class="library-page">
        <div style="text-align: center; margin-bottom: 50px;">
            <h1 style="font-size: 3rem; color: var(--accent);">Acervo Digital</h1>
            <p style="color: var(--text-muted);">Documentos, áudios e registros históricos das línguas do Maranhão.</p>
        </div>

        <!-- Barra de busca -->
        <div class="search-bar">
            <input
                type="search"
                id="busca"
                class="search-input"
                placeholder="🔍 Buscar no acervo..."
                aria-label="Buscar itens no acervo"
            >
        </div>

        <!-- Filtros por tipo -->
        <div class="filter-bar" id="filtros" role="group" aria-label="Filtrar por tipo">
            <button class="filter-btn active" data-tipo="todos">Todos</button>
            <button class="filter-btn" data-tipo="documento">Documentos</button>
            <button class="filter-btn" data-tipo="audio">Áudios</button>
            <button class="filter-btn" data-tipo="video">Vídeos</button>
            <button class="filter-btn" data-tipo="imagem">Imagens</button>
            <button class="filter-btn" data-tipo="outro">Outros</button>
        </div>

        <p class="contador-resultados" id="contador" aria-live="polite"></p>

        <div class="asset-grid" id="grid-acervo" aria-live="polite" aria-label="Itens do acervo">
            <!-- Skeletons enquanto carrega -->
            ${[1,2,3].map(() => `
            <div class="skeleton-card glass">
                <div class="skeleton-line sm"></div>
                <div class="skeleton-line lg"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line sm"></div>
            </div>`).join('')}
        </div>
    </main>

    <footer class="modern-footer">
        <p>&copy; 2026 Projeto Yarã. Conhecimento que atravessa gerações.</p>
    </footer>

    <script>
        const API_URL = 'http://localhost:8080';
        let todosItens = [];
        let filtroAtivo = 'todos';
        let buscaAtual = '';

        // Ícone e label por tipo
        const TIPO_CONFIG = {
            documento: { icon: 'fa-file-pdf',    label: 'Documento', acao: 'Baixar'   },
            audio:     { icon: 'fa-volume-up',   label: 'Áudio',     acao: 'Ouvir'    },
            video:     { icon: 'fa-video',        label: 'Vídeo',     acao: 'Assistir' },
            imagem:    { icon: 'fa-image',        label: 'Imagem',    acao: 'Visualizar'},
            outro:     { icon: 'fa-file-alt',     label: 'Outro',     acao: 'Acessar'  },
        };

        function criarCard(item) {
            const cfg = TIPO_CONFIG[item.tipo] || TIPO_CONFIG.outro;
            const data = item.created_at
                ? new Date(item.created_at).toLocaleDateString('pt-BR', { year: 'numeric', month: 'short' })
                : '';
            const btnClass = item.url ? 'download-btn' : 'download-btn sem-link';
            const btnHref  = item.url ? `href="${item.url}" target="_blank" rel="noopener"` : '';

            return `
            <article class="asset-card glass card-hover-effect" data-tipo="${item.tipo}">
                <div class="asset-icon"><i class="fas ${cfg.icon}"></i></div>
                <span class="asset-tipo-badge">${cfg.label}</span>
                <h3 class="asset-title">${item.titulo}</h3>
                <p class="asset-desc">${item.descricao || 'Sem descrição disponível.'}</p>
                <div class="asset-meta">
                    <span class="asset-etnia">
                        ${item.etnia_nome ? `<i class="fas fa-leaf"></i> ${item.etnia_nome}` : ''}
                        ${data ? `<span style="margin-left:6px; opacity:.6">${data}</span>` : ''}
                    </span>
                    <a ${btnHref} class="${btnClass}" ${!item.url ? 'title="Arquivo indisponível"' : ''}>
                        <i class="fas fa-${item.tipo === 'audio' ? 'headphones' : item.tipo === 'video' ? 'play' : 'download'}" style="margin-right:5px"></i>
                        ${cfg.acao}
                    </a>
                </div>
            </article>`;
        }

        function renderizar() {
            const grid = document.getElementById('grid-acervo');
            const contador = document.getElementById('contador');

            const busca = buscaAtual.toLowerCase().trim();
            const filtrados = todosItens.filter(item => {
                const matchTipo  = filtroAtivo === 'todos' || item.tipo === filtroAtivo;
                const matchBusca = !busca ||
                    item.titulo?.toLowerCase().includes(busca) ||
                    item.descricao?.toLowerCase().includes(busca) ||
                    item.etnia_nome?.toLowerCase().includes(busca);
                return matchTipo && matchBusca;
            });

            if (filtrados.length === 0) {
                grid.innerHTML = `
                <div class="estado-container">
                    <i class="fas fa-search"></i>
                    <p>Nenhum item encontrado${busca ? ` para "<strong>${busca}</strong>"` : ''} nesta categoria.</p>
                </div>`;
                contador.textContent = '';
            } else {
                grid.innerHTML = filtrados.map(criarCard).join('');
                const total = todosItens.length;
                contador.textContent = filtrados.length === total
                    ? `${total} item${total !== 1 ? 's' : ''} no acervo`
                    : `${filtrados.length} de ${total} item${total !== 1 ? 's' : ''}`;
            }
        }

        async function carregarAcervo() {
            const grid = document.getElementById('grid-acervo');
            try {
                const res = await fetch(`${API_URL}/acervo`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                todosItens = json.data || json || [];
                if (todosItens.length === 0) {
                    grid.innerHTML = `
                    <div class="estado-container">
                        <i class="fas fa-book-open"></i>
                        <p>O acervo ainda não possui itens cadastrados.</p>
                    </div>`;
                } else {
                    renderizar();
                }
            } catch (err) {
                console.error('Erro ao carregar acervo:', err);
                grid.innerHTML = `
                <div class="estado-container">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Não foi possível carregar o acervo.<br>
                       <small>Verifique se a API está rodando em <code>http://localhost:8080</code></small></p>
                    <button class="filter-btn" onclick="location.reload()" style="margin-top:8px">
                        <i class="fas fa-redo" style="margin-right:6px"></i>Tentar novamente
                    </button>
                </div>`;
            }
        }

        // Filtros
        document.getElementById('filtros').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtroAtivo = btn.dataset.tipo;
            renderizar();
        });

        // Busca com debounce
        let debounceTimer;
        document.getElementById('busca').addEventListener('input', e => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                buscaAtual = e.target.value;
                renderizar();
            }, 250);
        });

        // Iniciar
        carregarAcervo();
    </script>
</body>
</html>
