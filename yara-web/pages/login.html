<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Cadastro - Yarã</title>
    <link rel="stylesheet" href="../assets/css/modern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card glass">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Voltar ao Início
            </a>

            <div id="loginSection">
                <h2 id="loginTitle" class="u-mb-10">Bem-vindo de volta</h2>
                <p class="u-text-muted u-mb-30">Acesse sua conta para gerenciar o portal.</p>

                <div class="login-tabs">
                    <div class="tab-btn active">Usuário</div>
                    <div class="tab-btn">Administrador</div>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="loginEmail" placeholder="exemplo@yara.com" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="loginPass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-modern btn-primary u-w-100 u-mt-10">Entrar no Sistema</button>
                </form>

                <p class="u-mt-25 form-footer-text">
                    <span class="u-text-muted">Não tem uma conta?</span>
                    <a href="javascript:void(0)" data-toggle-form class="u-text-accent u-no-underline">Cadastre-se</a>
                </p>
            </div>

            <div id="signupSection" class="u-hidden">
                <h2 class="u-mb-10">Criar Conta</h2>
                <p class="u-text-muted u-mb-30">Junte-se à nossa comunidade.</p>

                <form id="signupForm">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="signupNome" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="signupEmail" placeholder="exemplo@yara.com" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="signupPass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-modern btn-primary u-w-100 u-mt-10">Criar Conta</button>
                </form>

                <p class="u-mt-25 form-footer-text">
                    <span class="u-text-muted">Já tem uma conta?</span>
                    <a href="javascript:void(0)" data-toggle-form class="u-text-accent u-no-underline">Faça Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
