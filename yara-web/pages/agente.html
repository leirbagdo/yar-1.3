<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarã Bot - Assistente Inteligente</title>
    <link rel="stylesheet" href="../assets/css/modern.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="nav-modern glass">
        <div class="logo-area">
            <img src="../img/yara94.png" alt="Logo Yarã">
            <span class="brand-text">YARÃ</span>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="nossa-voz.html">Nossa Voz</a>
            <a href="biblioteca.html">Biblioteca</a>
            <a href="timeline.html">História</a>
            <a href="contribuir.html">Dados</a>
            <a href="tradutor.html" class="active"> Tradutor</a>
            <a href="agente.html">Agente IA</a>
            <a href="sobreNos.html">Sobre Nós</a>
        </div>
        <div class="auth-btns">
            <a href="login.html" class="btn-modern btn-ghost">Entrar</a>
        </div>
    </nav>

    <main class="agent-page">
        <div class="chat-card glass">
            <div class="chat-header">
                <div class="bot-avatar"><i class="fas fa-robot"></i></div>
                <div>
                    <h3 class="u-text-accent">Yarã Bot</h3>
                    <p class="u-text-muted chat-subtitle">Assistente Especializado</p>
                </div>
            </div>

            <div class="chat-body" id="chatContainer">
                <div class="msg msg-bot">
                    Olá! Sou o Yarã Bot. Estou aqui para ajudar você a explorar as línguas e culturas dos povos originários do Maranhão. O que você gostaria de saber hoje?
                </div>
            </div>

            <div class="chat-footer">
                <input type="text" class="chat-input" id="userInput" placeholder="Digite sua pergunta aqui...">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <script src="../assets/js/agente.js"></script>
</body>
</html>
